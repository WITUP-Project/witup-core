name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      Z3_VERSION: z3-4.17.0
      LD_LIBRARY_PATH: ${{ github.workspace }}/native/linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install local Z3 Maven artifact
        run: |
          if [ ! -f ~/.m2/repository/com/microsoft/z3/z3/4.17.0/z3-4.17.0.jar ]; then
            mvn install:install-file \
              -Dfile=native/linux/z3-4.17.0.jar \
              -DgroupId=com.microsoft.z3 \
              -DartifactId=z3 \
              -Dversion=4.17.0 \
              -Dpackaging=jar
          fi

      - name: Verify native z3 libraries exist
        run: |
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          ls -la "$LD_LIBRARY_PATH"
          ldd "$LD_LIBRARY_PATH/libz3java.so"

      - name: Run Maven verify
        run: mvn -B -nsu clean verify