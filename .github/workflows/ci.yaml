name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      Z3_VERSION: z3-4.17.0
      LD_LIBRARY_PATH: ${{ github.workspace }}/src/main/resources/native/linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify native z3 libraries exist
        run: |
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          ls -la "$LD_LIBRARY_PATH"
          ldd "$LD_LIBRARY_PATH/libz3java.so"

      - name: Run Maven verify
        run: mvn clean verify